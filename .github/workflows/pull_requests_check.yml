name: 🚧 Code Quality

permissions:
  checks: write
  contents: read
  pull-requests: write

on: pull_request

jobs:
  checks:
    name: Code Checks
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Setup
      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      # Checks
      - name: Install Dependencies
        run: npm install

      - name: TypeScript Check
        run: npm run ts:check

      - name: ESLint Check
        run: npm run lint

      - name: Prettier Check
        run: npm run format:check
